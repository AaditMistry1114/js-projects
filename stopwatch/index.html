<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="header">Stopwatch</h1>

    <div id="container">

    <p id="result">00:00:00</p>

    <button type="button" id="startTimer" onclick="start()">Start</button>

    <button type="button" id="stopTimer" onclick="stop()">Stop</button>

    <button type="button" id="resetTimer" onclick="reset()">Reset</button>

    </div>

    <script src="index.js"></script>
</body>
</html>
