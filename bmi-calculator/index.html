<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="header">BMI Calculator</h1>

    <div id="container">
        
        <label for="height" class="myLabel">Height:</label>
        <input type="text" placeholder="Enter your height"id="height" class="myInput"><br><br>

        <label for="weight" class="myLabel">Weight:</label>
        <input type="text" id="weight" placeholder="Enter your weight" class="myInput"><br><br>

        <button type="submit" id="submitBtn">submit</button>
        
    </div>

    <p id="answer"></p>
    <script src="script.js"></script>
</body>
</html>
