<html lang="en">
<head>

    <title>Temperature Converter</title>

</head>
<body>

    <h1 id="header">Temperature Converter</h1>

    <input type="number" id="inputField"><br><br>

    <input type="radio" name="temp"  id="ctf">

    <input type="radio" name="temp" id="ftc">
    <label for="ftc">Farenheit - Celsius</label> <br><br>

    <button  id="convertBtn" onclick="converter()">convert</button>

    <p id="answer"></p>

    <script src="script.js"></script>
</body>
