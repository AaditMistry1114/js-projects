<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random-Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="container">
        <h1>Random Password Generator</h1>
    
        <h3>Select your requirements:</h3>

        <label>length:</label>
        <input type="number" id="length" min="8"><br><br>

        <input type="checkbox" id="lowerChars">
        <label>lowercase</label><br>

        <input type="checkbox" id="upperChars">
        <label>uppercase</label><br>

        <input type="checkbox" id="numChars">
        <label>numbers</label><br>

        <input type="checkbox" id="symbolChars">
        <label>symbols</label><br><br>

        <button onclick="generatePassword()">Generate</button>

        <p id="passResult"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
